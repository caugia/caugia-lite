<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The GRIP Health Diamond™ | Caugia</title>

  <link rel="icon" href="/C-logo.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="/C-logo.png">
  <meta name="msapplication-TileImage" content="/C-logo.png">

  <!-- MAIN CAUGIA CSS -->
  <link rel="stylesheet" href="assets/caugia.css?v=2.7" />

  <!-- 🔒 SECURITY -->
  <script src="/auth.js"></script>

  <!-- COMPONENT CSS -->
  <style>

  /* ==========================================
     Caugia GRIP Diamond — Premium Light Theme
     ========================================== */

  .diamond-page {
    background: #ffffff;
    color: var(--ink);
    padding-top: 120px;
    padding-bottom: 80px;
  }

  .diamond-container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ----------- Header ----------- */
  .diamond-header {
    text-align: center;
    margin-bottom: 50px;
  }

  .diamond-header h1 {
    font-size: 3rem;
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 14px;
  }

  .diamond-header p {
    max-width: 700px;
    margin: 0 auto;
    font-size: 1.1rem;
    line-height: 1.65;
    color: var(--ink);
  }

  /* ---------- Layout ---------- */
  .diamond-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 40px;
    align-items: flex-start;
  }

  @media (max-width: 980px) {
    .diamond-layout {
      grid-template-columns: 1fr;
    }
  }

  /* ---------- Diamond Wrapper ---------- */
  .diamond-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.04);
  }

  .diamond-wrapper {
    width: 100%;
    max-width: 540px;
    margin: 0 auto 28px;
  }

  .diamond-svg {
    width: 100%;
    aspect-ratio: 1;
  }

  /* ---------- Colors (Caugia brand) ---------- */
  .diamond-line {
    stroke: var(--blue);
    stroke-width: 2.2;
  }

  .diamond-axis {
    stroke: rgba(0,0,0,0.12);
    stroke-width: 1.2;
    stroke-dasharray: 4 4;
  }

  .diamond-score {
    stroke: var(--accent);
    stroke-width: 2;
    fill: var(--accent-soft);
    fill-opacity: 0.35;
  }

  .diamond-center {
    fill: var(--navy);
  }

  /* ---------- Dimension Labels ---------- */
  .dim-label {
    position: absolute;
    text-align: center;
    transform: translate(-50%, -50%);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
  }

  .dim-label .dot {
    width: 12px;
    height: 12px;
    background: var(--blue);
    border-radius: 50%;
    margin: 0 auto 6px;
  }

  /* ---------- Sidebar (Scores) ---------- */
  .diamond-sidebar {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.04);
  }

  .sidebar-section {
    margin-bottom: 26px;
  }

  .sidebar-section h3 {
    font-size: 1.25rem;
    margin-bottom: 10px;
    color: var(--blue);
  }

  .score-number {
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--navy);
  }

  .score-max {
    color: var(--ink);
    opacity: 0.6;
  }

  .score-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }

  .score-label {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--navy);
  }

  .score-value {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--blue);
  }

  /* ----------- Sliders ----------- */
  .sliders {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
  }

  .slider-item {
    padding: 12px 14px;
    background: #f9fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .slider-item label {
    display: block;
    margin-bottom: 4px;
    font-size: 0.85rem;
    color: var(--ink);
    opacity: 0.75;
  }

  .slider-item input[type="range"] {
    width: 100%;
  }

  </style>

</head>

<body>

<main class="diamond-page">
  <div class="diamond-container">

    <!-- HEADER -->
    <header class="diamond-header">
      <h1>The GRIP Health Diamond™</h1>
      <p>A clear, structured and premium visualisation of your GTM system across the four GRIP dimensions.</p>
    </header>

    <!-- LAYOUT -->
    <div class="diamond-layout">

      <!-- LEFT: DIAMOND -->
      <div class="diamond-card">
        <div class="diamond-wrapper" style="position: relative;">

          <!-- SVG -->
          <svg class="diamond-svg" viewBox="0 0 400 400">

            <!-- AXES -->
            <line class="diamond-axis" x1="200" y1="20" x2="200" y2="380"/>
            <line class="diamond-axis" x1="20"  y1="200" x2="380" y2="200"/>

            <!-- MAIN DIAMOND -->
            <polygon class="diamond-line" points="200,20 380,200 200,380 20,200"/>

            <!-- SCORE SHAPE -->
            <polygon id="scoreShape" class="diamond-score" points="200,80 320,200 200,320 80,200"></polygon>

            <!-- CENTER POINT -->
            <circle cx="200" cy="200" r="4" class="diamond-center"/>
          </svg>

          <!-- DIMENSION LABELS -->
          <div class="dim-label" style="top:4%; left:50%;">
            <div class="dot"></div>Guidance
          </div>

          <div class="dim-label" style="left:4%; top:50%;">
            <div class="dot"></div>Resources
          </div>

          <div class="dim-label" style="left:96%; top:50%;">
            <div class="dot"></div>Implementation
          </div>

          <div class="dim-label" style="top:96%; left:50%;">
            <div class="dot"></div>Performance
          </div>

        </div>

        <!-- SLIDERS -->
        <div class="sliders">

          <div class="slider-item">
            <label>Guidance</label>
            <input type="range" id="claritySlider" min="0" max="100" value="80">
          </div>

          <div class="slider-item">
            <label>Resources</label>
            <input type="range" id="capacitySlider" min="0" max="100" value="50">
          </div>

          <div class="slider-item">
            <label>Implementation</label>
            <input type="range" id="consistencySlider" min="0" max="100" value="70">
          </div>

          <div class="slider-item">
            <label>Performance</label>
            <input type="range" id="conversionSlider" min="0" max="100" value="65">
          </div>

        </div>

      </div>

      <!-- RIGHT: SIDEBAR -->
      <aside class="diamond-sidebar">

        <div class="sidebar-section">
          <h3>Your GTM Health</h3>
          <span class="score-number" id="overallScore">66</span><span class="score-max">/100</span>
        </div>

        <div class="sidebar-section">
          <div class="score-row">
            <span class="score-label">Guidance</span>
            <span class="score-value" id="clarityScoreLabel">80</span>
          </div>
          <div class="score-row">
            <span class="score-label">Resources</span>
            <span class="score-value" id="capacityScoreLabel">50</span>
          </div>
          <div class="score-row">
            <span class="score-label">Implementation</span>
            <span class="score-value" id="consistencyScoreLabel">70</span>
          </div>
          <div class="score-row">
            <span class="score-label">Performance</span>
            <span class="score-value" id="conversionScoreLabel">65</span>
          </div>
        </div>

      </aside>

    </div>

  </div>
</main>

<script>
/* ===== Same logic as your current diamond ===== */

function updateDiamond() {
  const c = +claritySlider.value;
  const r = +capacitySlider.value;
  const i = +consistencySlider.value;
  const p = +conversionSlider.value;

  document.getElementById("clarityScoreLabel").textContent = c;
  document.getElementById("capacityScoreLabel").textContent = r;
  document.getElementById("consistencyScoreLabel").textContent = i;
  document.getElementById("conversionScoreLabel").textContent = p;

  const overall = Math.round((c+r+i+p)/4);
  document.getElementById("overallScore").textContent = overall;

  const maxR = 180;

  const top    = `200,${200 - (c/100)*maxR}`;
  const right  = `${200 + (i/100)*maxR},200`;
  const bottom = `200,${200 + (p/100)*maxR}`;
  const left   = `${200 - (r/100)*maxR},200`;

  document.getElementById("scoreShape").setAttribute("points", `${top} ${right} ${bottom} ${left}`);
}

document.querySelectorAll("input[type='range']").forEach(el => {
  el.addEventListener("input", updateDiamond);
});

updateDiamond();
</script>

</body>
</html>
