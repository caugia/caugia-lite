<!DOCTYPE html>

<head>

<title>Approach | Caugia Studio</title>

<style>
:root{--ink:#0b132b;--blue:#0b66ff;--accent:#ff7700;--bg-light:#f9f9fb;--border:#e5e5e5;--maxw:1180px;--header-h:64px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;min-height:100vh;overflow-y:auto;opacity:0;transition:opacity .6s ease}
body.loaded{opacity:1}
header{position:fixed;inset:0 0 auto 0;height:var(--header-h);background:rgba(255,255,255,.98);border-bottom:1px solid rgba(0,0,0,.06);backdrop-filter:saturate(140%) blur(6px);z-index:10}
.container{max-width:var(--maxw);height:100%;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
a.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{height:28px}.brand span{font-weight:600;color:var(--ink)}
nav.nav-desktop{display:flex;align-items:center;gap:20px}
nav.nav-desktop a{color:var(--ink);text-decoration:none;font-weight:500;transition:color .25s ease}
nav.nav-desktop a:hover{color:var(--blue)}nav.nav-desktop a.active{color:var(--blue)}
.cta{background:var(--blue);color:#fff!important;text-decoration:none;padding:.55rem 1.1rem;border-radius:8px;font-weight:600;transition:background .25s ease,transform .25s ease}
.cta:hover{background:var(--accent);transform:scale(1.03)}
main{flex:1;padding:calc(var(--header-h)+56px) 24px 80px}.wrap{max-width:var(--maxw);margin:0 auto}
h1{font-size:2.6rem;font-weight:800;margin-bottom:20px}p{font-size:1.05rem;line-height:1.7;color:#1b1b1b;max-width:880px}
</style>
</head>
<body>
<header>
<div class="container">
  <a href="index.html" class="brand"><img src="C-logo.png" alt="Caugia C logo"><span>Caugia Studio</span></a>
  <nav class="nav-desktop">
    <a href="about.html">About</a><a href="approach.html">Approach</a><a href="use-cases.html">Use Cases</a>
    <a href="resources.html">Resources</a><a href="work.html">Work</a><a href="studio.html">Studio</a>
    <a class="cta" href="https://www.linkedin.com/in/meijertom" target="_blank">Get in touch</a>
  </nav>
</div>
</header>
<main><div class="wrap">
  <h1>Our Approach</h1>

</div></main>
<footer>© 2025 Caugia Studio · <a href="https://www.linkedin.com/in/meijertom" target="_blank">LinkedIn</a></footer>
<script>
window.addEventListener('load',()=>{
  document.body.classList.add('loaded');
  const current=window.location.pathname.split('/').pop();
  document.querySelectorAll('nav.nav-desktop a').forEach(a=>{
    if(a.getAttribute('href')===current){a.classList.add('active');}
  });
});
</script>
</body>
</html>
