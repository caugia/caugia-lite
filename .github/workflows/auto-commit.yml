name: Auto Commit from Caugia

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CAUGIA_TOKEN }}

      - name: Sync changes
        run: |
          git config user.name "Caugia-GPT"
          git config user.email "bot@caugia.ai"
          git add .
          git commit -m "🤖 Auto-update via Caugia-GPT" || echo "No changes to commit"
          git push origin main
