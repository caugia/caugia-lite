<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTM Architecture v4.1 – Caugia</title>
  <link rel="stylesheet" href="../assets/caugia.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
  <div class="c-header">
    <h1>🔄 GTM Architecture v4.1</h1>
    <p>Revenue Flow 🔴 | Support 🟠 | Collaboration 🔵 | Klik op segment voor details</p>
  </div>

  <div class="c-controls">
    <div>
      <button class="c-btn" onclick="showAll()">Show All</button>
      <button class="c-btn c-btn--secondary" onclick="showDirect()">Revenue Only</button>
      <button class="c-btn c-btn--secondary" onclick="showSupport()">Support Only</button>
      <button class="c-btn c-btn--secondary" onclick="showCollab()">Collab Only</button>
    </div>
    <div>
      <button class="c-btn c-btn--ghost" onclick="zoomIn()">+</button>
      <button class="c-btn c-btn--ghost" onclick="zoomOut()">-</button>
      <button class="c-btn c-btn--ghost" onclick="resetView()">Reset</button>
    </div>
  </div>

  <div id="container" class="c-canvas"></div>

  <div id="info-panel" class="c-panel">
    <button class="c-close" onclick="closeInfo()">×</button>
    <h3 id="info-title">Details</h3>
    <div id="info-content"></div>
  </div>

  <div id="legend" class="c-legend">
    <h4>Legenda</h4>
    <p><strong>🔴 Revenue Flow</strong> — directe handoffs (MQL → SQL → Won)</p>
    <p><strong>🟠 Support</strong> — GTM Eng & Sales Eng support teams</p>
    <p><strong>🔵 Collaboration</strong> — Enablement teams</p>
  </div>

  <script>
    const segments = {
      marketing:{name:'Marketing',color:'#4A90E2',x:100,y:80,type:'revenue'},
      'ib-sdr':{name:'Inbound SDR',color:'#7B68EE',x:550,y:80,type:'revenue'},
      'ob-sdr':{name:'Outbound SDR',color:'#7B68EE',x:550,y:300,type:'revenue'},
      ae:{name:'Account Executive',color:'#50C878',x:1000,y:80,type:'revenue'},
      cs:{name:'Customer Success',color:'#FF6B6B',x:1450,y:80,type:'revenue'},
      am:{name:'Account Management',color:'#FFA500',x:1900,y:80,type:'revenue'},
      'gtm-engineers':{name:'GTM Engineers',color:'#FF6B35',x:100,y:520,type:'support',new:true},
      'sales-engineers':{name:'Sales Engineers',color:'#2E8B57',x:1000,y:320,type:'support'},
      'sales-enablement':{name:'Sales Enablement',color:'#FF1493',x:450,y:720,type:'enablement'},
      revops:{name:'RevOps',color:'#20B2AA',x:900,y:720,type:'enablement'},
      support:{name:'Support',color:'#9370DB',x:1350,y:720,type:'enablement'},
      'gtm-leadership':{name:'GTM Leadership',color:'#DC143C',x:1800,y:720,type:'enablement'}
    };

    const flows = {
      direct:[
        {from:'marketing',to:'ib-sdr',label:'MQL'},
        {from:'ib-sdr',to:'ae',label:'SQL'},
        {from:'ae',to:'cs',label:'Won Deal'},
        {from:'cs',to:'am',label:'Expansion'}
      ],
      support:[
        {from:'gtm-engineers',to:'marketing',label:'ABM Lists'},
        {from:'gtm-engineers',to:'ae',label:'Intent'},
        {from:'sales-engineers',to:'ae',label:'Tech'},
        {from:'sales-engineers',to:'am',label:'Upsell'}
      ],
      collab:[
        {from:'sales-enablement',to:'ib-sdr',label:'Train'},
        {from:'revops',to:'ae',label:'Forecast'},
        {from:'support',to:'cs',label:'Escalate'}
      ]
    };

    let currentFilter='all';
    const svg=d3.select('#container').append('svg').attr('width','100%').attr('height','100%');
    const defs=svg.append('defs');
    ['direct','support','collab'].forEach(type=>{
      const c={direct:'#DC143C',support:'#FF6B35',collab:'#20B2AA'}[type];
      defs.append('marker').attr('id',`arrow-${type}`)
        .attr('markerWidth',10).attr('markerHeight',10).attr('refX',9).attr('refY',3).attr('orient','auto')
        .append('polygon').attr('points','0 0, 10 3, 0 6').attr('fill',c);
    });

    const g=svg.append('g');
    const zoom=d3.zoom().scaleExtent([0.3,3]).on('zoom',e=>g.attr('transform',e.transform));
    svg.call(zoom);

    function draw(){
      g.selectAll('*').remove();
      const bW=260,bH=120;

      Object.entries(flows).forEach(([type,list])=>{
        if(currentFilter==='all'||currentFilter===type){
          list.forEach(f=>{
            const a=segments[f.from],b=segments[f.to];
            g.append('line')
              .attr('x1',a.x+bW/2).attr('y1',a.y+bH)
              .attr('x2',b.x+bW/2).attr('y2',b.y)
              .attr('class',`flow-${type}`)
              .attr('stroke',type==='direct'?'#DC143C':type==='support'?'#FF6B35':'#20B2AA')
              .attr('stroke-width',type==='direct'?4:type==='support'?3:2)
              .attr('fill','none')
              .attr('marker-end',`url(#arrow-${type})`);
            g.append('text')
              .attr('class','c-label-text')
              .attr('x',(a.x+b.x+bW)/2)
              .attr('y',(a.y+b.y+bH)/2)
              .text(f.label);
          });
        }
      });

      Object.entries(segments).forEach(([id,s])=>{
        const box=g.append('g')
          .attr('transform',`translate(${s.x},${s.y})`)
          .on('click',()=>showInfo(id));
        box.append('rect')
          .attr('width',bW).attr('height',bH).attr('fill',s.color)
          .attr('stroke','#000').attr('stroke-width',3).attr('rx',8);
        box.append('text')
          .attr('x',bW/2).attr('y',60)
          .attr('text-anchor','middle')
          .attr('fill','#fff')
          .attr('font-size',14).attr('font-weight',700)
          .text(s.name);
      });
    }

    function showInfo(id){
      const seg=segments[id];
      const p=document.getElementById('info-panel');
      document.getElementById('info-title').textContent=seg.name;
      document.getElementById('info-content').innerHTML=
        `<div class="c-section"><div class="title">Type</div>
         <div class="content">${seg.type}</div></div>`;
      p.classList.add('is-active');
    }
    function closeInfo(){document.getElementById('info-panel').classList.remove('is-active');}
    function showAll(){currentFilter='all';draw();}
    function showDirect(){currentFilter='direct';draw();}
    function showSupport(){currentFilter='support';draw();}
    function showCollab(){currentFilter='collab';draw();}
    function zoomIn(){svg.transition().call(zoom.scaleBy,1.3);}
    function zoomOut(){svg.transition().call(zoom.scaleBy,0.77);}
    function resetView(){svg.transition().call(zoom.transform,d3.zoomIdentity);}
    draw();
  </script>
</body>
</html>
