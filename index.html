<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caugia Studio — From Data to Direction</title>
  <style>
    :root {
      --caugia-blue: #0046A5;
      --insight-orange: #F36C21;
      --deep-navy: #002A5C;
      --signal-white: #FFFFFF;
      --ai-silver: #E6E9EF;
      --text-dark: #0b132b;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--signal-white);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: saturate(160%) blur(10px);
      border-bottom: 1px solid #f1f3f7;
      z-index: 50;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--deep-navy);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
    }

    .brand img {
      height: 44px; /* groter logo in header */
      width: auto;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 1.4rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: var(--deep-navy);
      font-weight: 600;
      transition: color 0.25s ease;
    }

    nav a:hover {
      color: var(--insight-orange);
    }

    .btn-contact {
      background-color: var(--caugia-blue);
      color: #fff;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-contact:hover {
      background-color: #003a8c;
    }

    /* HERO */
    main {
      padding-top: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding-bottom: 3rem;
    }

    img.hero-logo {
      width: 260px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      color: var(--deep-navy);
    }

    .accent {
      color: var(--insight-orange);
    }

    p {
      font-size: 1.25rem;
      max-width: 700px;
      line-height: 1.6;
      margin: 0 auto 2rem auto;
      color: #1b1b1b;
    }

    a.button {
      background-color: var(--caugia-blue);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.3s ease;
      display: inline-block;
    }

    a.button:hover {
      background-color: #003a8c;
    }

    /* FOOTER */
    footer {
      margin-top: auto;
      padding: 2rem 0;
      font-size: 0.9rem;
      color: #777;
    }

    footer a {
      color: var(--deep-navy);
      text-decoration: none;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav ul {
        display: none;
      }
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
        padding: 0 1rem;
      }
      img.hero-logo {
        width: 190px;
      }
      .brand img {
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="nav">
      <a href="#" class="brand">
        <img src="C-logo.png" alt="Caugia Icon" />
