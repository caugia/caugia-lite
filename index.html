<!-- Caugia 3P Diagram (SVG) -->
<figure style="max-width:900px;margin:40px auto;">
  <svg viewBox="0 0 900 460" role="img" aria-labelledby="caugia3pTitle caugia3pDesc" width="100%" height="100%">
    <title id="caugia3pTitle">Caugia Studio — 3P Framework</title>
    <desc id="caugia3pDesc">Diagram showing People, Process, and Performance feeding a central Predictable Revenue Engine.</desc>

    <defs>
      <!-- Brand Colors -->
      <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0046A5"/>
        <stop offset="100%" stop-color="#002A5C"/>
      </linearGradient>
      <linearGradient id="gradOrange" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F36C21"/>
        <stop offset="100%" stop-color="#D85F1D"/>
      </linearGradient>

      <!-- Soft shadow -->
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002A5C" flood-opacity="0.12"/>
      </filter>

      <!-- Arrowhead -->
      <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
        <path d="M0,0 L12,6 L0,12 Z" fill="#0046A5"/>
      </marker>

      <!-- Token styles -->
      <style>
        .card { fill: #FFFFFF; stroke: #E6E9EF; stroke-width: 1; }
        .label { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #002A5C; font-size: 16px; font-weight: 600; }
        .sub   { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #002A5C; opacity: .75; font-size: 13px; }
        .chip  { fill: url(#gradBlue); filter: url(#softShadow); }
        .chipText { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #FFFFFF; font-size: 13px; font-weight: 600; letter-spacing: .2px; }
      </style>
    </defs>

    <!-- Background panel -->
    <rect x="20" y="20" width="860" height="420" rx="24" fill="#F7F8FB" stroke="#E6E9EF" />

    <!-- Center: Predictable Revenue Engine -->
    <g transform="translate(450,230)">
      <!-- Outer ring -->
      <circle r="96" fill="url(#gradBlue)" filter="url(#softShadow)"/>
      <!-- Inner ring -->
      <circle r="70" fill="#FFFFFF" stroke="#0046A5" stroke-width="2"/>
      <!-- Title -->
      <text text-anchor="middle" fill="#002A5C" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-weight="700" font-size="16" y="-6">
        Predictable Revenue Engine
      </text>
      <text text-anchor="middle" class="sub" y="16">From Data to Direction</text>
    </g>

    <!-- Nodes: People / Process / Performance -->
    <!-- People (left) -->
    <g transform="translate(170,120)">
      <rect class="card" x="-120" y="-60" width="240" height="120" rx="16"/>
      <text class="label" x="0" y="-10" text-anchor="middle">People</text>
      <text class="sub" x="0" y="16" text-anchor="middle">Roles • Alignment • Enablement</text>
      <!-- Chips -->
      <g transform="translate(-92,34)">
        <rect class="chip" x="0" y="0" width="88" height="26" rx="13"/>
        <text class="chipText" x="44" y="17" text-anchor="middle">Marketing</text>
      </g>
      <g transform="translate(6,34)">
        <rect class="chip" x="0" y="0" width="70" height="26" rx="13"/>
        <text class="chipText" x="35" y="17" text-anchor="middle">SDR</text>
      </g>
      <g transform="translate(86,34)">
        <rect class="chip" x="0" y="0" width="68" height="26" rx="13"/>
        <text class="chipText" x="34" y="17" text-anchor="middle">CSM</text>
      </g>
    </g>

    <!-- Process (top-right) -->
    <g transform="translate(720,120)">
      <rect class="card" x="-120" y="-60" width="240" height="120" rx="16"/>
      <text class="label" x="0" y="-10" text-anchor="middle">Process</text>
      <text class="sub" x="0" y="16" text-anchor="middle">Flows • Playbooks • Tools</text>
      <!-- Chips -->
      <g transform="translate(-102,34)">
        <rect class="chip" x="0" y="0" width="76" height="26" rx="13"/>
        <text class="chipText" x="38" y="17" text-anchor="middle">HubSpot</text>
      </g>
      <g transform="translate(-16,34)">
        <rect class="chip" x="0" y="0" width="64" height="26" rx="13"/>
        <text class="chipText" x="32" y="17" text-anchor="middle">Nooks</text>
      </g>
      <g transform="translate(56,34)">
        <rect class="chip" x="0" y="0" width="76" height="26" rx="13"/>
        <text class="chipText" x="38" y="17" text-anchor="middle">Madkudu</text>
      </g>
    </g>

    <!-- Performance (bottom-right) -->
    <g transform="translate(720,340)">
      <rect class="card" x="-120" y="-60" width="240" height="120" rx="16"/>
      <text class="label" x="0" y="-10" text-anchor="middle">Performance</text>
      <text class="sub" x="0" y="16" text-anchor="middle">KPI • Forecast • AI Signals</text>
      <!-- Chips -->
      <g transform="translate(-90,34)">
        <rect class="chip" x="0" y="0" width="84" height="26" rx="13"/>
        <text class="chipText" x="42" y="17" text-anchor="middle">Win Rate</text>
      </g>
      <g transform="translate(2,34)">
        <rect class="chip" x="0" y="0" width="88" height="26" rx="13"/>
        <text class="chipText" x="44" y="17" text-anchor="middle">Velocity</text>
      </g>
      <g transform="translate(96,34)">
        <rect class="chip" x="0" y="0" width="86" height="26" rx="13"/>
        <text class="chipText" x="43" y="17" text-anchor="middle">Forecast</text>
      </g>
    </g>

    <!-- Arrows to center -->
    <g stroke="#0046A5" stroke-width="3" marker-end="url(#arrow)" opacity="0.9">
      <!-- People -> Center -->
      <path d="M 290 120 C 360 120, 380 120, 450 170" fill="none"/>
      <!-- Process -> Center -->
      <path d="M 600 120 C 560 120, 520 120, 510 170" fill="none"/>
      <!-- Performance -> Center -->
      <path d="M 600 340 C 560 330, 520 300, 510 280" fill="none"/>
    </g>

    <!-- Accent arc in Insight Orange -->
    <path d="M 352 112 A 120 120 0 0 1 548 112" fill="none" stroke="url(#gradOrange)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </svg>
  <figcaption style="text-align:center;color:#6B7280;font:13px/1.6 Inter, sans-serif;margin-top:8px;">
    People • Process • Performance — aligned into one Predictable Revenue Engine.
  </figcaption>
</figure>
